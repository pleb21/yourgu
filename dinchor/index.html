<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dinchor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="dinchor" />
  <meta name="theme-color" content="#3d6852" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>dinchor</h1>
    <div id="date-nav">
      <button type="button" id="prev-day" aria-label="Previous day">‹</button>
      <div id="current-date"></div>
      <button type="button" id="next-day" aria-label="Next day">›</button>
      <button type="button" id="today-btn">Today</button>
    </div>
  </header>
  <main>
    <div id="data-actions">
      <button type="button" id="export-btn">Export</button>
      <button type="button" id="import-btn">Import</button>
      <input type="file" id="import-file-input" accept="application/json" hidden />
    </div>
    <form id="add-form">
      <input type="text" id="label-input" placeholder="What are you doing?" required />
      <input type="time" id="start-input" required />
      <input type="time" id="end-input" required />
      <button type="submit">Add</button>
      <div id="duration-chips">
        <button type="button" class="chip" data-minutes="5">5m</button>
        <button type="button" class="chip" data-minutes="10">10m</button>
        <button type="button" class="chip" data-minutes="15">15m</button>
        <button type="button" class="chip" data-minutes="30">30m</button>
        <button type="button" class="chip" data-minutes="45">45m</button>
        <button type="button" class="chip" data-minutes="60">1h</button>
        <button type="button" class="chip" data-minutes="120">2h</button>
      </div>
    </form>
    <p id="empty-hint">No entries yet today. Add your first one above.</p>
    <div id="timeline"></div>
  </main>
  <dialog id="edit-dialog">
    <form id="edit-form">
      <h2>Edit entry</h2>
      <input type="text" id="edit-label-input" required />
      <div class="edit-time-row">
        <input type="time" id="edit-start-input" required />
        <span>to</span>
        <input type="time" id="edit-end-input" required />
      </div>
      <div class="edit-actions">
        <button type="button" id="edit-delete-btn" class="danger-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
          <span id="edit-delete-label">Delete</span>
        </button>
        <div class="edit-actions-right">
          <button type="button" id="edit-cancel-btn">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </div>
    </form>
  </dialog>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
